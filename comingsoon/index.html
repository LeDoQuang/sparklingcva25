<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Coming Soon</title>
  <link rel="icon" type="image/png" href="photo/dau.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    /* Decorative title font from root /fonts */
    @font-face {
      font-family: 'BlazeGlory';
      src: url('../fonts/MTD-Blaze-Glory.otf') format('opentype');
      font-weight: 400;
      font-style: normal;
      font-display: swap;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --gradient: linear-gradient(135deg, #6ae3ff 0%, #a78bfa 50%, #ff6ec7 100%);
      --text-color: #ffffff;
      --bg-dark: rgba(10, 10, 20, 0.95);
    }

    body {
      font-family: 'Be Vietnam Pro', sans-serif;
      background: #0a0a14;
      color: var(--text-color);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow-x: hidden;
    }

    body::before {
      content: '';
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-image: image-set(url('photo/bg1.webp') type('image/webp'), url('photo/bg1.png') type('image/png'));
      background-repeat: repeat;
      background-size: auto;
      z-index: -1;
      opacity: 0.4;
    }

    .container {
      text-align: center;
      padding: 2rem;
      max-width: 800px;
      animation: fadeIn 1s ease-in;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    h1 {
      font-family: 'BlazeGlory', 'Be Vietnam Pro', sans-serif;
      font-size: clamp(15rem, 35vw, 30rem);
      font-weight: 400;
      background: var(--gradient);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 1.5rem;
      letter-spacing: 2px;
      animation: glow 3s ease-in-out infinite;
      line-height: 1;
    }

    @keyframes glow {
      0%, 100% { filter: drop-shadow(0 0 20px rgba(106, 227, 255, 0.5)); }
      50% { filter: drop-shadow(0 0 40px rgba(167, 139, 250, 0.8)); }
    }

    .subtitle {
      font-size: clamp(1.2rem, 3vw, 1.8rem);
      color: rgba(255, 255, 255, 0.8);
      margin-bottom: 3rem;
      font-weight: 500;
    }

    .links {
      display: flex;
      flex-direction: column;
      gap: 1rem;
      margin-top: 3rem;
    }

    .link-btn {
      display: inline-block;
      padding: 1rem 2rem;
      background: rgba(106, 227, 255, 0.1);
      border: 2px solid transparent;
      border-radius: 12px;
      color: var(--text-color);
      text-decoration: none;
      font-size: 1.1rem;
      font-weight: 600;
      transition: all 0.3s ease;
      backdrop-filter: blur(10px);
      position: relative;
      overflow: hidden;
    }

    .link-btn::before {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: var(--gradient);
      transition: left 0.5s ease;
      z-index: -1;
    }

    .link-btn:hover::before {
      left: 0;
    }

    .link-btn:hover {
      border-color: rgba(106, 227, 255, 0.5);
      transform: translateY(-3px);
      box-shadow: 0 10px 30px rgba(106, 227, 255, 0.3);
    }

    .home-btn {
      margin-top: 2rem;
      background: rgba(255, 110, 199, 0.1);
    }

    @media (max-width: 768px) {
      .container {
        padding: 1.5rem;
      }

      .link-btn {
        padding: 0.8rem 1.5rem;
        font-size: 1rem;
      }
    }

    /* Safari/iOS performance tweaks */
    @supports (-webkit-touch-callout: none) {
      /* Avoid heavy fixed-layer repaints on iOS */
      body::before { position: absolute; opacity: 0.3; }
      /* Tone down animated glow; use static shadow */
      h1 { animation: none; filter: none; text-shadow: 0 0 24px rgba(106,227,255,0.35), 0 0 40px rgba(167,139,250,0.45); }
      .link-btn { backdrop-filter: blur(6px); }
    }

    /* Respect reduced motion */
    @media (prefers-reduced-motion: reduce) {
      .container, h1 { animation: none !important; }
      .link-btn { transition-duration: 0.001ms !important; }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>?</h1>

    <div class="links">
      <a href="/" class="link-btn home-btn">
        COMING SOON
      </a>
    </div>
  </div>
</body>
</html>
